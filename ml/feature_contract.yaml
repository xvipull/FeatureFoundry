domain: customer_churn
entity:
  name: customer
  join_key: customer_id
event_time: event_timestamp
offline_store: postgres_feature_history
online_store: redis_feature_cache
freshness_policy:
  default_minutes: 30
features:
  - name: customer_30d_spend
    version: v3
    source: orders_stream
    transformation: sum(completed_order_amount) over 30d
    data_quality: { null_rate_max: 0.01, min: 0, freshness_minutes: 30 }
  - name: payment_failure_rate
    version: v4
    source: payments_batch
    transformation: failed_payments / all_payment_attempts over 30d
    data_quality: { null_rate_max: 0.02, min: 0, max: 1, freshness_minutes: 30 }
